<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FileZap — Chuyển file tức thì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-dot"></span>
    <span id="status-text">Đang kết nối...</span>
  </div>

  <!-- App Shell -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="logo-title">FileZap</div>
          <div class="logo-sub">GitHub Transfer Bridge</div>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadFiles()" title="Refresh">
        <span class="refresh-icon">↻</span>
      </button>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab active" data-tab="upload" onclick="switchTab('upload', this)">
        <span class="tab-icon">↑</span>
        <span>Upload</span>
      </button>
      <button class="tab" data-tab="files" onclick="switchTab('files', this)">
        <span class="tab-icon">☰</span>
        <span>Files</span>
        <span class="badge" id="file-count">0</span>
      </button>
    </div>

    <!-- Upload Tab -->
    <div class="tab-content active" id="tab-upload">

      <!-- Drop Zone -->
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="drop-title">Chọn hoặc kéo file vào đây</div>
        <div class="drop-sub">Mọi định dạng · Tối đa 5MB</div>
        <input type="file" id="file-input" multiple hidden onchange="onFilesSelected(this.files)">
      </div>

      <!-- Selected Files Queue -->
      <div class="queue" id="queue"></div>

      <!-- Upload Button -->
      <button class="upload-btn" id="upload-btn" onclick="uploadAll()" disabled>
        <span class="btn-icon">⚡</span>
        <span id="upload-btn-text">Upload</span>
      </button>

      <!-- Progress Bar -->
      <div class="progress-wrap" id="progress-wrap" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">0%</div>
      </div>

    </div>

    <!-- Files Tab -->
    <div class="tab-content" id="tab-files">
      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-input" placeholder="Tìm file..." oninput="filterFiles(this.value)">
      </div>
      <div id="file-list">
        <div class="empty-state">
          <div class="empty-icon">📁</div>
          <div>Chưa có file nào</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Config Modal (first run) -->
  <div class="modal-overlay" id="config-modal">
    <div class="modal">
      <div class="modal-icon">⚙️</div>
      <h2 class="modal-title">Cấu hình lần đầu</h2>
      <p class="modal-desc">Nhập thông tin GitHub repo của bạn</p>

      <label class="field-label">GitHub Username</label>
      <input class="modal-input" id="cfg-username" type="text" placeholder="vd: johndoe">

      <label class="field-label">Repo Name</label>
      <input class="modal-input" id="cfg-repo" type="text" placeholder="vd: file-transfer-app" value="file-transfer-app">

      <label class="field-label">GitHub Token (upload)</label>
      <input class="modal-input" id="cfg-token" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <div class="field-hint">
        ⚠️ Token lưu trong trình duyệt (localStorage). Dùng Token với quyền <code>repo</code>.
        <a href="https://github.com/settings/tokens" target="_blank" class="hint-link">Tạo token →</a>
      </div>

      <button class="modal-btn" onclick="saveConfig()">Lưu & bắt đầu ⚡</button>
    </div>
  </div>

  <!-- File Preview Modal -->
  <div class="modal-overlay hidden" id="preview-modal" onclick="closePreview(event)">
    <div class="modal preview-modal">
      <div class="preview-header">
        <div class="preview-filename" id="preview-name"></div>
        <button class="preview-close" onclick="document.getElementById('preview-modal').classList.add('hidden')">✕</button>
      </div>
      <div id="preview-content"></div>
      <div class="preview-actions">
        <button class="action-btn primary" id="preview-download">⬇ Tải về</button>
        <button class="action-btn" id="preview-copy">⎘ Copy link</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
