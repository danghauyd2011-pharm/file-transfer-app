<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileZap Fixed</title>
<style>
body{
  background:#111;
  color:#eee;
  font-family:Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}
input,button{
  padding:10px;
  margin:5px 0;
  width:100%;
}
button{
  cursor:pointer;
}
.file{
  border:1px solid #333;
  padding:10px;
  margin:10px 0;
}
a{
  color:#4da3ff;
}
</style>
</head>
<body>

<h2>FileZap — Fixed Version</h2>

<h3>Supabase Config</h3>

<input id="url" placeholder="https://xxxx.supabase.co">
<input id="key" placeholder="Anon key">
<input id="bucket" placeholder="Bucket name" value="filezap">

<button onclick="saveCfg()">Save Config</button>

<hr>

<input type="file" id="fileInput" multiple>

<button onclick="uploadFiles()">Upload</button>

<hr>

<button onclick="loadFiles()">Refresh Files</button>

<div id="status"></div>

<div id="files"></div>

<script>

const CFG_KEY = 'fz_cfg';

let cfg = loadCfg();

function loadCfg(){
  try{
    return JSON.parse(localStorage.getItem(CFG_KEY)||'{}');
  }catch{
    return {};
  }
}

function saveCfg(){

  cfg = {
    url: document.getElementById('url').value.trim().replace(/\/$/,''),
    key: document.getElementById('key').value.trim(),
    bucket: document.getElementById('bucket').value.trim()
  };

  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

  setStatus('Saved config');
}

document.getElementById('url').value = cfg.url || '';
document.getElementById('key').value = cfg.key || '';
document.getElementById('bucket').value = cfg.bucket || 'filezap';

function setStatus(t){
  document.getElementById('status').innerText = t;
}

function publicUrl(name){

  return `${cfg.url}/storage/v1/object/public/${cfg.bucket}/${name
    .split('/')
    .map(encodeURIComponent)
    .join('/')}`;
}

async function uploadFiles(){

  const files = document.getElementById('fileInput').files;

  if(!files.length){
    alert('Chọn file');
    return;
  }

  for(const file of files){

    try{

      const safeName =
        `${Date.now()}_${file.name.replace(/[^\w.\-()]/g,'_')}`;

      const path =
        `${cfg.url}/storage/v1/object/${cfg.bucket}/${safeName}`;

      const r = await fetch(path,{
        method:'POST',
        headers:{
          apikey: cfg.key,
          Authorization:`Bearer ${cfg.key}`,
          'x-upsert':'true'
        },
        body:file
      });

      if(!r.ok){

        const err = await r.text();

        console.error(err);

        throw new Error(err);
      }

      setStatus('Uploaded: ' + safeName);

    }catch(e){

      console.error(e);

      setStatus('Upload error: ' + e.message);
    }
  }

  await new Promise(r=>setTimeout(r,1500));

  loadFiles();
}

async function loadFiles(){

  try{

    const r = await fetch(
      `${cfg.url}/storage/v1/object/list/${cfg.bucket}`,
      {
        method:'POST',
        headers:{
          apikey: cfg.key,
          Authorization:`Bearer ${cfg.key}`,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          limit:200,
          offset:0,
          sortBy:{
            column:'created_at',
            order:'desc'
          }
        })
      }
    );

    if(!r.ok){

      const txt = await r.text();

      console.error(txt);

      throw new Error(txt);
    }

    const data = await r.json();

    const files = (Array.isArray(data)?data:[])
      .filter(f =>
        f.name &&
        f.id != null &&
        !f.name.endsWith('/')
      );

    renderFiles(files);

    setStatus('Loaded ' + files.length + ' files');

  }catch(e){

    console.error(e);

    setStatus('Load error: ' + e.message);
  }
}

function renderFiles(files){

  const el = document.getElementById('files');

  if(!files.length){
    el.innerHTML = '<p>No files</p>';
    return;
  }

  el.innerHTML = files.map(f=>{

    const url = publicUrl(f.name);

    return `
      <div class="file">
        <b>${escapeHtml(f.name)}</b><br><br>

        <a href="${url}" target="_blank">
          Open
        </a>

        <br><br>

        <button onclick="downloadFile('${url}','${encodeURIComponent(f.name)}')">
          Download
        </button>
      </div>
    `;
  }).join('');
}

async function downloadFile(url,name){

  try{

    const r = await fetch(url);

    if(!r.ok){
      throw new Error('Download failed');
    }

    const blob = await r.blob();

    const a = document.createElement('a');

    a.href = URL.createObjectURL(blob);

    a.download = decodeURIComponent(name);

    document.body.appendChild(a);

    a.click();

    a.remove();

  }catch(e){

    console.error(e);

    window.open(url,'_blank');
  }
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

if(cfg.url && cfg.key){
  loadFiles();
}

</script>

</body>
</html>
